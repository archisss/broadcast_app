    <script>
      // Runtime environment guard: ensure window.fetch is writable and has both getter and setter
      // Prevents "Uncaught TypeError: Cannot set property fetch of #<Window> which has only a getter" in iframes/sandboxes
      (function() {
        try {
          var nativeFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
          var activeFetch = nativeFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return activeFetch;
            },
            set: function(newFetch) {
              activeFetch = newFetch;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var pDesc = Object.getOwnPropertyDescriptor(proto, 'fetch');
              if (pDesc && pDesc.configurable) {
                var pFetch = typeof window.fetch === 'function' ? window.fetch.bind(window) : window.fetch;
                Object.defineProperty(proto, 'fetch', {
                  get: function() {
                    return pFetch;
                  },
                  set: function(fn) {
                    pFetch = fn;
                  },
                  configurable: true,
                  enumerable: true
                });
              }
            }
          } catch (err) {
            // Ignore if sealed
          }
        }
      })();
    </script>
